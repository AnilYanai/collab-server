# =========================================================================
# Collab Application Configuration (Development Stage)
# =========================================================================

# -------------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------------
logging.level.root=WARN
#logging.level.com.anilyanai=INFO

# =========================================================================
# 1. TCP Transport Configuration
# =========================================================================
collab.connector.tcp-enabled=true
collab.connector.tcp-port=8080

# TCP Inbound: Dedicated NIO Reactor & Platform Worker Pool
# chose 5 worker thread because 2 worker thread + 1 incoming selector + 5 outgoing selector = 8 thread
collab.connector.tcp-inbound-worker-threads=2
collab.connector.tcp-inbound-batch-size=4

# TCP Outbound: Dedicated NIO Write Selectors (for broadcasting across CPU cores)
collab.connector.tcp-outbound-selector-threads=1

# TCP Kernel Socket Buffer Sizes (128 KB)
collab.connector.tcp-send-buffer-size=131072
collab.connector.tcp-receive-buffer-size=131072

# =========================================================================
# 2. UDP Transport Configuration
# =========================================================================
collab.connector.udp-enabled=true
collab.connector.udp-port=8080

# UDP Inbound: Dedicated NIO Reactor & Isolated FIFO Worker Pool
# (Tip: Set to 1 for 100% strict sequential ordering, or >1 for multi-core throughput)
# worker thread is 7 because , 7 worker thread + incoming selector (for outbound the worker is writing without a selector) = 8 thread
collab.connector.udp-inbound-worker-threads=7
collab.connector.udp-inbound-batch-size=8

# UDP Outbound: Parallel Non-Blocking Egress Sockets (eliminates single-socket lock contention)
collab.connector.udp-outbound-egress-channels=64

# =========================================================================
# 3. Security Configuration (HMAC-SHA256 Token Verification)
# =========================================================================
collab.security.hmac-secret=collab-benchmark-secret-key-256bit-ok
collab.security.admin-secret=collab-master-admin-secret-key-256bit

# =========================================================================
# 4. Cluster / Peer Mesh Configuration
# =========================================================================
collab.cluster.enabled=false
collab.cluster.port=9090
collab.cluster.worker-threads=4
collab.cluster.peers=3
